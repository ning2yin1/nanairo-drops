<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#a81208">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="懐かしくて、あたらしい。ナナイロ ドロップス。">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./assets/icon-192.png">
<link rel="icon" href="./assets/icon-192.png">
<link rel="stylesheet" href="./styles.css?v=4">
<title>ナナイロ ドロップス</title>
</head>
<body>
<main>
<section id="title-screen" class="screen" data-game-touch="locked" aria-label="ナナイロ ドロップス TOP">
<img class="title-background" src="./assets/title-background.png" alt="ナナイロ ドロップス。果物と七色の飴をあしらった昭和レトロなお菓子缶" width="707" height="1536" fetchpriority="high" draggable="false">
<div class="title-art">
<button id="start" class="start" type="button" aria-label="スタート"><img src="./assets/start-button.png" alt="" width="630" height="204" draggable="false"></button>
</div>
</section>
<section id="preparing-screen" class="screen" data-game-touch="locked" aria-labelledby="preparing-title" hidden>
<div class="preparing-tin">
<p class="brand">ナナイロ<br>ドロップス</p>
<div class="message">
<p class="small-label">おたのしみは、これから。</p>
<h1 id="preparing-title" tabindex="-1">ただいま<br>準備中です</h1>
<div class="drops" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
<p class="note">もう少しだけお待ちくださいね！</p>
</div>
<button id="back" class="back" type="button">もどる</button>
</div>
</section>
</main>
<p id="image-error" role="alert" hidden>画像を読み込めませんでした。通信状態を確認して、再度ページを開いてください。</p>
<script type="module" src="./app.js?v=4"></script>
</body>
</html>
